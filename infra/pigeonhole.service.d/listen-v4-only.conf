# Drop-in for a host with no usable IPv6. Binding [::]:8883 fails outright
# when the kernel has IPv6 disabled, and the broker refuses to start rather
# than fall back to a narrower listener. Install as
#   /etc/systemd/system/pigeonhole.service.d/listen-v4-only.conf
# and daemon-reload. Delete it once the host has its global v6 address and
# route, before the AAAA record is published: an AAAA pointing at a
# v4-only listener is a black hole for v6-preferring devices.
[Service]
Environment=PIGEONHOLE_LISTEN=0.0.0.0:8883
